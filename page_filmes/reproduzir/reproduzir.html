<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LumFlix | Player</title>

	<link rel="stylesheet" href="../../authentication_page/Shared/style.css">
	<link rel="stylesheet" href="../catalogo.css">
	<link rel="stylesheet" href="reproduzir.css">
</head>

<body>

	<header class="leitor-topo">

		<a class="voltar" href="../filmes/filmes.html">
			&larr; Back
		</a>

		<div class="leitor-titulo">
			<h1 id="titulo">Loading&hellip;</h1>
			<p class="meta" id="meta"></p>
		</div>

	</header>


	<main class="palco">

		<div class="moldura">

			<video
				id="video"
				controls
				playsinline
				preload="metadata">
			</video>


			<div class="sobreposto" id="espera">

				<div class="disco" aria-hidden="true"></div>

				<p id="esperaTexto">
					Preparing the film&hellip;
				</p>

			</div>


			<div class="sobreposto" id="falha" hidden>

				<p>

					<strong>
						This one will not play
					</strong>

					<span id="falhaTexto">
						The video server did not answer.
					</span>

				</p>

				<a
					class="button pill"
					href="../filmes/filmes.html">
					Back to movies
				</a>

			</div>

		</div>

	</main>


	<footer class="leitor-rodape">

		<p id="creditos">
			Streamed by LUMFLIX.
		</p>

	</footer>


	<script>

		const $ = (id) =>
			document.getElementById(id);


		/* ---------------------------------------------------------
		 * CONFIG
		 * --------------------------------------------------------- */

		const SESSAO =
			'../../authentication_page/Shared/session.php';

		const LOGIN =
			'../../authentication_page/Login/auth.html';

		const TORRENT =
			'../torrent.php';

		const CONTINUAR =
			'../continuar_ver/ver.php';


		/*
		 * Neste momento o teste aceita:
		 *
		 * ?arquivo=...
		 *
		 * e
		 *
		 * ?magnet=magnet:...
		 *
		 * Mais tarde o magnet será obtido automaticamente
		 * pela API.
		 */

		const params =
			new URLSearchParams(window.location.search);

		const arquivo =
			params.get('arquivo') || '';

		const magnet =
			params.get('magnet') || '';


		/* ---------------------------------------------------------
		 * ESTADO
		 * --------------------------------------------------------- */

		let filme = null;

		let token = '';

		let retomarEm = 0;

		let registado = false;

		let ultimoEnvio = 0;


		/* ---------------------------------------------------------
		 * ERRO
		 * --------------------------------------------------------- */

		function falhar(texto) {

			$('espera').hidden = true;

			$('falha').hidden = false;

			if (texto) {
				$('falhaTexto').textContent = texto;
			}
		}


		/* ---------------------------------------------------------
		 * ARRANQUE
		 * --------------------------------------------------------- */

		(async () => {

			/*
			 * Verificar sessão.
			 */
			try {

				const res = await (
					await fetch(SESSAO, {
						credentials: 'same-origin'
					})
				).json();


				if (!res.authenticated) {

					window.location.replace(LOGIN);

					return;
				}

			} catch (err) {

				console.error(
					'Sessão:',
					err
				);

			}


			if (!arquivo && !magnet) {

				falhar(
					'No film was selected.'
				);

				return;
			}


			/*
			 * Carregar progresso e iniciar vídeo.
			 */
			await carregarProgresso();

			await tocar();

		})();


		/* ---------------------------------------------------------
		 * FILME
		 *
		 * Mantémos a informação que vinha do catálogo.
		 *
		 * Para já o título vem do arquivo se não houver catálogo.
		 * --------------------------------------------------------- */

		async function carregarFilme() {

			if (!arquivo) {
				return;
			}

			/*
			 * Não precisamos do Archive.
			 *
			 * O catálogo atual pode continuar a fornecer os dados
			 * visuais através do próprio frontend.
			 */
		}


		/* ---------------------------------------------------------
		 * PROGRESSO
		 * --------------------------------------------------------- */

		async function carregarProgresso() {

			try {

				const res = await (
					await fetch(
						`${CONTINUAR}?action=listar`,
						{
							headers: {
								'Accept':
									'application/json'
							},
							credentials:
								'same-origin'
						}
					)
				).json();


				if (res.status !== 'ok') {
					return;
				}


				token = res.token;


				/*
				 * Só conseguimos recuperar o título se
				 * o catálogo o fornecer.
				 *
				 * Por enquanto procuramos pelo arquivo.
				 */
				const ja =
					(res.itens || []).find(
						x => x.titulo === arquivo
					);


				if (
					ja &&
					ja.progresso > 0 &&
					ja.progresso < 97
				) {

					retomarEm =
						ja.progresso;
				}

			} catch (err) {

				console.error(
					'Progresso:',
					err
				);

			}
		}


		/* ---------------------------------------------------------
		 * INICIAR TORRENT
		 * --------------------------------------------------------- */

		async function iniciarTorrent() {

			if (!magnet) {

				throw new Error(
					'Este filme ainda não tem magnet associado.'
				);
			}


			const url =
				`${TORRENT}?action=start&magnet=`
				+ encodeURIComponent(magnet);


			const resposta =
				await fetch(url, {
					headers: {
						'Accept':
							'application/json'
					},
					credentials:
						'same-origin'
				});


			if (!resposta.ok) {

				throw new Error(
					'Não foi possível contactar o servidor torrent.'
				);
			}


			const res =
				await resposta.json();


			if (
				res.status !== 'ok' ||
				!res.id
			) {

				throw new Error(
					res.error ||
					'Não foi possível iniciar o torrent.'
				);
			}


			return res.id;
		}


		/* ---------------------------------------------------------
		 * ESPERAR PELO VÍDEO
		 * --------------------------------------------------------- */

		async function esperarVideo(id) {

			for (
				let tentativa = 0;
				tentativa < 120;
				tentativa++
			) {

				const resposta =
					await fetch(
						`${TORRENT}?action=stream&id=${encodeURIComponent(id)}`,
						{
							headers: {
								'Accept':
									'application/json'
							},
							credentials:
								'same-origin'
						}
					);


				if (resposta.ok) {

					const res =
						await resposta.json();


					if (
						res.status === 'ok' &&
						res.video
					) {

						return res.video;
					}
				}


				/*
				 * Esperar 1 segundo.
				 */
				await new Promise(
					resolve =>
						setTimeout(resolve, 1000)
				);
			}


			throw new Error(
				'O vídeo demorou demasiado tempo a preparar.'
			);
		}


		/* ---------------------------------------------------------
		 * TOCAR
		 * --------------------------------------------------------- */

		async function tocar() {

			try {

				$('esperaTexto').textContent =
					'Connecting to the torrent network…';


				/*
				 * 1. Adicionar torrent ao servidor.
				 */
				const id =
					await iniciarTorrent();


				$('esperaTexto').textContent =
					'Preparing video…';


				/*
				 * 2. Esperar que o WebTorrent encontre
				 *    o ficheiro de vídeo.
				 */
				const videoUrl =
					await esperarVideo(id);


				/*
				 * 3. Finalmente o browser recebe apenas
				 *    HTTP vídeo.
				 */
				$('video').src =
					videoUrl;


			} catch (err) {

				console.error(
					'Player:',
					err
				);


				falhar(
					err.message ||
					'Could not start the video.'
				);
			}
		}


		const video =
			$('video');


		/* ---------------------------------------------------------
		 * VÍDEO PRONTO
		 * --------------------------------------------------------- */

		video.addEventListener(
			'loadeddata',
			() => {

				$('espera').hidden = true;


				/*
				 * Retomar.
				 */
				if (
					retomarEm > 0 &&
					Number.isFinite(
						video.duration
					)
				) {

					video.currentTime =
						video.duration *
						(retomarEm / 100);
				}

			}
		);


		/* ---------------------------------------------------------
		 * ERRO DO PLAYER
		 * --------------------------------------------------------- */

		video.addEventListener(
			'error',
			() => {

				falhar(
					'The video could not be played by this browser.'
				);

			}
		);


		/* ---------------------------------------------------------
		 * CONTINUAR A VER
		 * --------------------------------------------------------- */

		video.addEventListener(
			'play',
			registar
		);


		video.addEventListener(
			'timeupdate',
			() => {

				if (
					!Number.isFinite(video.duration) ||
					video.duration === 0
				) {
					return;
				}


				if (
					video.currentTime -
					ultimoEnvio < 10
				) {
					return;
				}


				ultimoEnvio =
					video.currentTime;


				guardarProgresso();

			}
		);


		video.addEventListener(
			'pause',
			guardarProgresso
		);


		window.addEventListener(
			'pagehide',
			guardarProgresso
		);


		/* ---------------------------------------------------------
		 * REGISTAR
		 * --------------------------------------------------------- */

		async function registar() {

			if (
				registado ||
				!token
			) {
				return;
			}


			registado = true;


			try {

				await chamar(
					'registar',
					{
						titulo:
							arquivo,

						categoria:
							'',

						extra:
							'',

						arte:
							''
					}
				);

			} catch (err) {

				console.error(
					'Registar:',
					err
				);

			}
		}


		/* ---------------------------------------------------------
		 * GUARDAR PROGRESSO
		 * --------------------------------------------------------- */

		function guardarProgresso() {

			if (
				!token ||
				!Number.isFinite(
					video.duration
				) ||
				video.duration === 0
			) {
				return;
			}


			const pct =
				Math.round(
					(video.currentTime /
						video.duration) *
					100
				);


			if (pct <= 0) {
				return;
			}


			try {

				chamar(
					'progresso',
					{
						titulo:
							arquivo,

						progresso:
							Math.min(
								100,
								pct
							)
					}
				);

			} catch (err) {

				console.error(
					'Progresso:',
					err
				);

			}
		}


		/* ---------------------------------------------------------
		 * POST CONTINUAR
		 * --------------------------------------------------------- */

		function chamar(
			action,
			campos
		) {

			const corpo =
				new FormData();


			corpo.append(
				'action',
				action
			);


			corpo.append(
				'token',
				token
			);


			Object.entries(
				campos
			).forEach(
				([k, v]) =>
					corpo.append(k, v)
			);


			return fetch(
				CONTINUAR,
				{
					method: 'POST',

					headers: {
						'X-Requested-With':
							'XMLHttpRequest',

						'Accept':
							'application/json'
					},

					credentials:
						'same-origin',

					body: corpo,

					keepalive: true
				}
			);
		}

	</script>

</body>
</html>
