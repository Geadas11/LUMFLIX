<!--
	[PAGINA-ADMIN] admin_page.html
	Aprovacao de contas: lista as que estao a espera de decisao e deixa
	aceitar ou negar cada uma. Fala com admin.php.
-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Approvals | LumFlix Admin</title>
	<link rel="stylesheet" href="../authentication_page/Shared/style.css">
	<link rel="stylesheet" href="admin.css">
</head>
<body>
	<!-- Mostrado quando a sessao nao e de administrador -->
	<div id="gate" class="gate hidden">
		<h1>Restricted area</h1>
		<p>The panel session expired or has not started. Sign in through the site login with the administrator credentials.</p>
		<a class="button pill" href="../authentication_page/Login/auth.html">Go to sign in</a>
	</div>

	<div id="app" class="admin-shell hidden">
		<header class="admin-top">
			<h1>Approvals</h1>
			<p class="admin-who">Signed in as <strong id="whoami"></strong></p>
		</header>

		<nav class="admin-nav">
			<a href="admin_page.html" aria-current="page">Approvals</a>
			<a href="overview.html">Overview</a>
			<button type="button" class="logout" id="logout">Sign out</button>
		</nav>

		<div id="notice" class="notice" role="status"></div>

		<section class="admin-section">
			<h2>Waiting for a decision</h2>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>Account</th>
							<th>Created</th>
							<th>2FA</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="pendingBody"></tbody>
				</table>
			</div>
		</section>

		<section class="admin-section">
			<h2>Already decided</h2>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>Account</th>
							<th>Status</th>
							<th>Decided</th>
							<th>By</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="reviewedBody"></tbody>
				</table>
			</div>
		</section>
	</div>

	<script src="admin.js"></script>
	<script>
		const { $, esc, fmtDate, statusTag, boolTag } = Admin;

		function emptyRow(cols, text) {
			return `<tr><td class="empty" colspan="${cols}">${esc(text)}</td></tr>`;
		}

		function actions(user, status) {
			const buttons = [];
			if (status !== 'approved') {
				buttons.push(`<button type="button" class="act act-approve" data-do="approve" data-user="${esc(user)}">Approve</button>`);
			}
			if (status !== 'denied') {
				buttons.push(`<button type="button" class="act act-deny" data-do="deny" data-user="${esc(user)}">Deny</button>`);
			}
			buttons.push(`<button type="button" class="act" data-do="delete" data-user="${esc(user)}">Delete</button>`);
			return `<div class="row-actions">${buttons.join('')}</div>`;
		}

		function render(users) {
			const pending = users.filter((u) => u.status === 'pending');
			const reviewed = users.filter((u) => u.status !== 'pending');

			$('pendingBody').innerHTML = pending.length
				? pending.map((u) => `
					<tr>
						<td class="user-cell">${esc(u.user)}</td>
						<td>${esc(fmtDate(u.created_at))}</td>
						<td>${boolTag(u.has_2fa, 'Yes', 'No')}</td>
						<td>${actions(u.user, u.status)}</td>
					</tr>`).join('')
				: emptyRow(4, 'Nothing waiting. All caught up.');

			$('reviewedBody').innerHTML = reviewed.length
				? reviewed.map((u) => `
					<tr>
						<td class="user-cell">${esc(u.user)}</td>
						<td>${statusTag(u.status)}</td>
						<td>${esc(fmtDate(u.reviewed_at))}</td>
						<td>${esc(u.reviewed_by || '—')}</td>
						<td>${actions(u.user, u.status)}</td>
					</tr>`).join('')
				: emptyRow(5, 'No decisions yet.');
		}

		const DONE = {
			approve: (u) => `Account ${u} approved.`,
			deny: (u) => `Account ${u} denied.`,
			delete: (u) => `Account ${u} deleted.`,
		};

		async function refresh() {
			const data = await Admin.load();
			if (data.ok) render(data.users);
		}

		document.addEventListener('click', async (ev) => {
			const btn = ev.target.closest('.act[data-do]');
			if (!btn) return;

			const { do: what, user } = btn.dataset;

			if (what === 'delete' && !confirm(`Delete the account ${user}? This cannot be undone.`)) {
				return;
			}

			/* trava os botões da linha enquanto o pedido corre, para dois
			   cliques seguidos não dispararem duas ações */
			btn.closest('.row-actions').querySelectorAll('.act').forEach((b) => { b.disabled = true; });
			Admin.clearNotice();

			let res;
			try {
				res = await Admin.api(what, { user });
			} catch (err) {
				Admin.noticeError('default');
				await refresh();
				return;
			}

			if (res.status !== 'ok') {
				Admin.noticeError(res.error);
			} else {
				Admin.notice(DONE[what] ? DONE[what](user) : 'Done.');
			}

			await refresh();
		});

		Admin.wireLogout();
		refresh();
	</script>
</body>
</html>
